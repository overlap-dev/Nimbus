packages:
  - packages/*
  - examples/eventsourcing-demo
  - docs

# Shared dependency versions. Reference them with `"<name>": "catalog:"` in
# the package.json files so a version only has to be bumped in one place.
catalog:
  '@biomejs/biome': ^2.6.2
  '@hono/node-server': ^2.1.5
  '@opentelemetry/api': ^1.9.1
  '@opentelemetry/sdk-metrics': ^3.0.0
  '@opentelemetry/sdk-node': ^0.300.0
  '@types/node': ^26.6.5
  eventsourcingdb: ^1.9.1
  hono: ^4.13.7
  mongodb: 7.1.1
  picocolors: ^1.1.1
  typescript: ^5.9.3
  ulid: ^3.0.2
  zod: ^4.4.3

# Supply-chain protection: only install package versions that have been on the
# registry for at least two days (replaces the former `.npmrc`
# `min-release-age=2`).
minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - '@nimbus-cqrs/*'

# Lifecycle scripts are blocked unless listed here. esbuild (vitepress) needs
# its postinstall; the others are optional native addons pulled in via
# testcontainers (eventsourcingdb) that work fine without being built.
allowBuilds:
  esbuild: true
  cpu-features: false
  protobufjs: false
  ssh2: false

# Formerly `overrides` in docs/package.json.
overrides:
  vite: 6.4.4
  brace-expansion: ^5.0.9
  dompurify: ^3.4.17
  katex: ^0.18.2
  linkify-it: ^5.0.2
  markdown-it: ^14.3.2
  nanoid: ^3.3.18
  postcss: ^8.5.23
  source-map-js: ^1.2.2
  vue: ^3.5.44
