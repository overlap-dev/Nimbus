name: Code Checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Build, Type Check, Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Reads the pnpm version from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Dependents type check against the built `dist/` of their siblings,
      # so the packages have to be built before `check` and `test`.
      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm check

      - name: Format & Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm --filter @nimbus-cqrs/docs build

      - name: Verify LLM artifacts
        run: |
          test -f docs/.vitepress/dist/llms.txt
          test -f docs/.vitepress/dist/llms-full.txt
          test -f docs/.vitepress/dist/guide/core/commands.md
