name: Publish Packages

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  publish-npm:
    name: Publish to npm
    permissions:
      contents: read
      id-token: write # For OIDC trusted publishing and provenance attestations.

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      # Trusted publishing requires a GitHub-hosted runner and `id-token: write`.
      # Do NOT configure NODE_AUTH_TOKEN / a registry token here: pnpm prefers
      # a static token over OIDC when one is present.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # Publishes every public workspace package in dependency order
      # (`@nimbus-cqrs/core` first). `workspace:^` ranges are rewritten to the
      # published versions. Versions that already exist on the registry are
      # skipped, so re-running a half-finished release is safe.
      - name: Publish @nimbus-cqrs/* packages
        run: pnpm -r publish --access public --provenance --no-git-checks
