apiVersion: schema.esdm.io/core/v1
kind: event
name: logged-out
description: A Session ended on purpose.
scope:
  domain: esdm-full-example
  boundedContext: iam
data:
  type: object
  required: [session-id, actor]
  properties:
    actor:
      type: string
      description: >-
        user-id of the User whose command produced this event, or
        "system" when the domain emitted it itself (ADR-0005).
    session-id:
      type: string
      format: uuid
