apiVersion: schema.esdm.io/core/v1
kind: command
name: login
description: >-
  Presents Credentials to start a Session. Handling the command checks
  the Credentials against the User they name and assigns the session-id.
scope:
  domain: esdm-full-example
  boundedContext: iam
  dynamicConsistencyBoundary: auth
data:
  type: object
  required: [email, password]
  properties:
    email:
      type: string
      format: email
    password:
      type: string
      minLength: 1
publishes:
  - logged-in
actors:
  - user
constraints:
  - name: credentials-must-match
    rule: Rejected when the Credentials match no User.
