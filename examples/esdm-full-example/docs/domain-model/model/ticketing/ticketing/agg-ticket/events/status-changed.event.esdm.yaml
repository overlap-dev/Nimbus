apiVersion: schema.esdm.io/core/v1
kind: event
name: status-changed
description: A Ticket moved to another Status.
scope:
  domain: esdm-full-example
  boundedContext: ticketing
  aggregate: ticket
data:
  type: object
  required: [ticket-id, status, actor]
  properties:
    actor:
      type: string
      description: >-
        user-id of the User whose command produced this event, or
        "system" when the domain emitted it itself (ADR-0005).
    ticket-id:
      type: string
      format: uuid
    status:
      type: string
      enum: [new, open, in-progress, done]
