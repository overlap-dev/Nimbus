apiVersion: schema.esdm.io/core/v1
kind: command
name: create
description: >-
  Opens a Ticket. The acting User is recorded as the Reporter. The Ticket
  starts unassigned, in Status new, and not archived. Handling the
  command assigns the ticket-id.
scope:
  domain: esdm-full-example
  boundedContext: ticketing
  aggregate: ticket
data:
  type: object
  required: [title]
  properties:
    title:
      type: string
      minLength: 1
    description:
      type: string
publishes:
  - created
actors:
  - user
