apiVersion: schema.esdm.io/core/v1
kind: event
name: archived
description: >-
  A Ticket was archived by the settled-archive watch. The actor is
  system (ADR-0005).
scope:
  domain: esdm-full-example
  boundedContext: ticketing
  aggregate: ticket
data:
  type: object
  required: [ticket-id, actor]
  properties:
    actor:
      type: string
      description: >-
        user-id of the User whose command produced this event, or
        "system" when the domain emitted it itself (ADR-0005).
    ticket-id:
      type: string
      format: uuid
